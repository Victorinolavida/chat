[project]
name = "chat"
version = "0.1.0"
description = "Real-time chat app with Flask, WebSockets, and a React SPA"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "flask>=3.1.3",
    "flask-jwt-extended>=4.7.4",
    "flask-migrate>=4.1.0",
    "flask-socketio>=5.7.0",
    "flask-sqlalchemy>=3.1.1",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
